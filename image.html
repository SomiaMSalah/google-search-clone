<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Images</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- رابط العودة لصفحة البحث الرئيسية في أعلى اليمين -->
    <div class="nav-links">
        <a href="index.html">Google Search</a>
    </div>

    <!-- حاوية محتوى صفحة الصور -->
    <div class="main-container">
        <!-- شعار جوجل مع كلمة Images بجانبه لتشبه جوجل الحقيقي -->
        <h1 class="logo">
            <span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span>
            <span class="images-text">Images</span>
        </h1>

        <!-- نموذج البحث الموجه للصور -->
        <form action="https://www.google.com/search" method="GET">
            <!-- حقل مخفي يُخبر جوجل أننا نريد البحث في الصور (عبر معلمة tbm=isch) -->
            <input type="hidden" name="tbm" value="isch">

            <div class="search-bar-container">
                <input type="text" name="q" class="search-input" autofocus>
            </div>

            <div class="buttons-container">
                <input type="submit" value="Search Images" class="search-btn">
            </div>
        </form>
    </div>

</body>
</html>
